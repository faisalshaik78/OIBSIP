<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive browser calculator built with vanilla JavaScript.">
  <title>Calculator | OIBSIP Task 1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <header class="heading"><p class="eyebrow">OIBSIP · TASK 1</p><h1>Calculator</h1><p class="muted">A simple, everyday calculator</p></header>
    <section class="screen" aria-label="Calculator display">
      <div id="expression" class="expression" aria-live="polite">Ready</div>
      <output id="display" class="display" aria-live="polite">0</output>
    </section>
    <div class="keys" aria-label="Calculator keys">
      <button type="button" class="utility" data-action="clear">C</button>
      <button type="button" class="utility" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="operator" data-operator="/">÷</button>
      <button type="button" class="operator" data-operator="*">×</button>
      <button type="button" data-number="7">7</button><button type="button" data-number="8">8</button><button type="button" data-number="9">9</button><button type="button" class="operator" data-operator="-">−</button>
      <button type="button" data-number="4">4</button><button type="button" data-number="5">5</button><button type="button" data-number="6">6</button><button type="button" class="operator" data-operator="+">+</button>
      <button type="button" data-number="1">1</button><button type="button" data-number="2">2</button><button type="button" data-number="3">3</button>
      <button type="button" class="equals" data-action="equals">=</button>
      <button type="button" class="zero" data-number="0">0</button><button type="button" data-action="decimal">.</button>
    </div>
    <p id="status" class="status" role="status">Use the buttons or your keyboard.</p>
  </main>
</body>
</html>
