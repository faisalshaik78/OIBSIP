<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="A to-do app with editable tasks and local storage."><title>Daily Tasks | OIBSIP Task 3</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><main class="app"><header><p class="eyebrow">OIBSIP · TASK 3</p><h1>Make room<br>for <em>what matters.</em></h1><p class="sub">A little progress, every day.</p></header><form id="task-form"><label class="sr-only" for="task-input">New task</label><input id="task-input" maxlength="180" placeholder="What needs doing?" autocomplete="off" required><button type="submit">Add task <span>＋</span></button></form><section><div class="list-heading"><h2>Pending tasks</h2><span id="pending-count">0 pending</span></div><ul id="pending-list" class="task-list"></ul><p id="pending-empty" class="empty">All clear. Add a task to get started ✨</p></section><section><div class="list-heading"><h2>Completed</h2><span id="completed-count">0 completed</span></div><ul id="completed-list" class="task-list"></ul><p id="completed-empty" class="empty">Completed tasks will appear here.</p></section><footer>Tasks stay in this browser using localStorage.</footer></main></body></html>
